<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="990" viewBox="0 0 1280 990" role="img" aria-labelledby="title desc"><title id="title">CodeWeb — from source to understanding</title><desc id="desc">Source files feed static extraction. Graph JSON bypasses extraction and enters the full graph. Separate view state controls layouts, the SVG map, and the inspector. Graph data, view settings, and SVG can be exported.</desc><defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#303236"/></pattern><linearGradient id="panel" x2="1" y2="1"><stop stop-color="#192940"/><stop offset="1" stop-color="#101a2b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 10 5-10 5" fill="#a8f0d2"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif}.heading{fill:#edf3ff;font-size:21px;font-weight:650}.body{fill:#aabbd3;font-size:16px}.small{fill:#8498b5;font-size:14px}.label{fill:#a8bbff;font-size:12px;font-weight:700;letter-spacing:2px}.link{fill:none;stroke:#a8f0d2;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1280" height="990" rx="24" fill="#18191b"/><rect width="1280" height="990" rx="24" fill="url(#dots)"/><svg x="48" y="40" width="58" height="58" viewBox="0 0 240 240">
  <rect width="240" height="240" rx="36" fill="#050505" />
  <rect x="2" y="2" width="236" height="236" rx="34" stroke="#1A1A1A" stroke-width="2" />
  <!-- Outer White 'C' Perimeter Edges -->
  <path d="M 120 44 L 54 82 V 158 L 120 196" stroke="#FFFFFF" stroke-width="16" stroke-linecap="square" stroke-linejoin="miter" />
  <!-- Inner Phosphor Green 'W' Graph Edges -->
  <path d="M 54 82 L 120 120 L 120 196 L 186 158 V 82 L 120 120" stroke="#00FF66" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Air-Gap Knockouts at Isometric Vertices -->
  <circle cx="120" cy="44" r="16" fill="#050505" />
  <circle cx="54" cy="82" r="16" fill="#050505" />
  <circle cx="186" cy="82" r="16" fill="#050505" />
  <circle cx="120" cy="120" r="18" fill="#050505" />
  <circle cx="54" cy="158" r="16" fill="#050505" />
  <circle cx="186" cy="158" r="16" fill="#050505" />
  <circle cx="120" cy="196" r="16" fill="#050505" />
  <!-- Nodes -->
  <circle cx="120" cy="44" r="9" fill="#FFFFFF" />
  <circle cx="54" cy="82" r="9" fill="#FFFFFF" />
  <circle cx="54" cy="158" r="9" fill="#FFFFFF" />
  <circle cx="120" cy="196" r="9" fill="#00FF66" />
  <circle cx="186" cy="82" r="9" fill="#00FF66" />
  <circle cx="186" cy="158" r="9" fill="#00FF66" />
  <!-- Center Hub -->
  <circle cx="120" cy="120" r="9" fill="#050505" stroke="#00FF66" stroke-width="6" />
</svg><text x="122" y="67" fill="#eef3ff" font-size="33" font-weight="700">CodeWeb</text><text x="122" y="96" class="body">See how your code fits together.</text><text x="1232" y="65" text-anchor="end" class="label">APPLICATION ARCHITECTURE</text><text x="48" y="161" fill="#eef3ff" font-size="34" font-weight="650">From source to understanding.</text><text x="48" y="195" class="body">One portable HTML file. A full graph underneath. A focused map on screen.</text><text x="48" y="254" class="label">01 / BRING YOUR CODE</text><rect x="48" y="273" width="270" height="119" rx="14" fill="url(#panel)" stroke="#344660"/><text x="70" y="310" class="heading">Source folder</text><text x="70" y="341" class="body">Choose a folder or drop files</text><text x="70" y="366" class="body">Source stays in your browser</text><rect x="48" y="445" width="270" height="94" rx="14" fill="url(#panel)" stroke="#344660"/><text x="70" y="482" class="heading">Graph JSON</text><text x="70" y="513" class="body">Reopen an extracted snapshot</text><rect x="370" y="273" width="340" height="119" rx="14" fill="url(#panel)" stroke="#746333"/><text x="392" y="310" class="heading">Static extraction</text><text x="392" y="341" class="body">Imports · routes · data models</text><text x="392" y="366" class="body">File paths + source evidence</text><path class="link" d="M318 332H362"/><path class="link" d="M540 392v47"/><path class="link" d="M318 492H362"/><rect x="370" y="447" width="340" height="230" rx="18" fill="#122b2a" stroke="#a8f0d2"/><text x="394" y="482" fill="#a8f0d2" font-size="12" font-weight="700" letter-spacing="2">02 / THE FULL GRAPH</text><text x="394" y="520" class="heading">Connected facts, with evidence</text><text x="394" y="550" class="body">Nodes + directional relationships</text><path d="M406 595h80l50 40 90-40" fill="none" stroke="#a8f0d2" stroke-width="2"/><path d="m486 595 140 0" stroke="#d6ad55" stroke-width="2" stroke-dasharray="5 5"/><circle cx="406" cy="595" r="8" fill="#b692f6"/><circle cx="486" cy="595" r="8" fill="#53d7ed"/><circle cx="536" cy="635" r="8" fill="#f48dc5"/><circle cx="626" cy="595" r="8" fill="#f5c451"/><text x="394" y="661" class="small">Confirmed / possible connections</text><text x="770" y="254" class="label">03 / MAKE IT READABLE</text><rect x="770" y="273" width="462" height="119" rx="14" fill="url(#panel)" stroke="#6a588b"/><text x="792" y="310" class="heading">Independent view settings</text><text x="792" y="341" class="body">Search · filters · selected neighborhoods</text><text x="792" y="366" class="body">Layers / Grid / Force · theme · camera</text><path class="link" d="M710 515h30V332h22"/><path class="link" d="M1000 392v47"/><rect x="770" y="447" width="462" height="230" rx="18" fill="#101b2c" stroke="#456b7d"/><text x="792" y="480" class="heading">Interactive map + inspector</text><rect x="792" y="502" width="263" height="151" rx="10" fill="#0c1220" stroke="#2d405d"/><path d="m831 539 101 31-66 52M932 570l84-25" fill="none" stroke="#a8f0d2" stroke-width="2"/><path d="m831 539 35 83" stroke="#d6ad55" stroke-dasharray="4 4"/><rect x="810" y="527" width="56" height="25" rx="6" fill="#719dff"/><rect x="909" y="557" width="56" height="25" rx="6" fill="#53d7ed"/><rect x="841" y="612" width="56" height="25" rx="6" fill="#70df92"/><rect x="986" y="533" width="47" height="25" rx="6" fill="#f5c451"/><text x="838" y="544" fill="#0c1220" font-size="11" text-anchor="middle">UI</text><text x="937" y="574" fill="#0c1220" font-size="11" text-anchor="middle">Service</text><text x="869" y="629" fill="#0c1220" font-size="11" text-anchor="middle">Route</text><text x="1009" y="550" fill="#0c1220" font-size="11" text-anchor="middle">Data</text><text x="1073" y="533" fill="#eef3ff" font-size="14" font-weight="600">Selected node</text><path d="M1073 547h134M1073 568h110M1073 582h125M1073 613h134M1073 627h106" stroke="#344b69" stroke-width="5" stroke-linecap="round"/><text x="1073" y="648" class="small">Source evidence</text><path d="M48 713H1232" stroke="#344660"/><text x="48" y="744" class="label">04 / TAKE IT WITH YOU</text><rect x="48" y="762" width="376" height="70" rx="12" fill="#141f31" stroke="#344660"/><circle cx="71" cy="785" r="4" fill="#a8f0d2"/><text x="88" y="791" fill="#eef3ff" font-size="17" font-weight="600">Graph JSON</text><text x="88" y="815" class="small">Full extracted data</text><rect x="452" y="762" width="376" height="70" rx="12" fill="#141f31" stroke="#344660"/><circle cx="475" cy="785" r="4" fill="#b692f6"/><text x="492" y="791" fill="#eef3ff" font-size="17" font-weight="600">View JSON</text><text x="492" y="815" class="small">View settings for the matching graph</text><rect x="856" y="762" width="376" height="70" rx="12" fill="#141f31" stroke="#344660"/><circle cx="879" cy="785" r="4" fill="#53d7ed"/><text x="896" y="791" fill="#eef3ff" font-size="17" font-weight="600">Diagram SVG</text><text x="896" y="815" class="small">A shareable visual snapshot</text><text x="48" y="867" class="small">View controls change presentation; they do not discard extracted graph data.</text><path d="M48 887H1232" stroke="#344660"/><g fill="#8498b5" font-size="14"><text x="48" y="912">• Viewing guidance: ≤ 300 everyday · 300–1,000 Layers + filters · 1,000+ smaller neighborhoods. No enforced cap.</text><text x="48" y="935">• Performance varies. Large Force layouts can be slow; Grid can overlap. Static extraction can miss relationships.</text><text x="48" y="958">• Extraction: 5,000 files · 2 MB / file · 40 MB total. Local folder access requires selection or drop.</text></g></svg>